[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pre-action-uq"
version = "0.1.0"
description = "Pre-action uncertainty quantification for RAG-augmented LLMs"
requires-python = ">=3.10"
dependencies = [
    "llama-cpp-python",
    "numpy",
    "scipy",
    "scikit-learn",
    "pandas",
    "pydantic>=2.0",
    "pyyaml",
    "orjson",
    "tqdm",
    "matplotlib",
    "plotly",
    "anthropic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ipython",
]

[tool.setuptools.packages.find]
where = ["src"]
